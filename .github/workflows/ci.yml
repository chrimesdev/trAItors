name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'm*']
  pull_request:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Zip HTML5 build for itch.io
        run: cd dist && zip -r ../traitors-html5.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: traitors-html5
          path: traitors-html5.zip

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: traitors-html5.zip
          generate_release_notes: true
